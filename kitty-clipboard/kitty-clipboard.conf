# >>> kitty-clipboard >>>
# Right click: copy+clear the selection if any, otherwise paste. ctrl+v pastes (images pass through to the app).
mouse_map right press ungrabbed launch --type=background --allow-remote-control --stdin-source=@selection ~/.config/kitty/rclick.sh
map ctrl+v launch --type=background --allow-remote-control ~/.config/kitty/rclick.sh paste
# <<< kitty-clipboard <<<
