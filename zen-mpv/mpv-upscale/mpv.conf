# mpv profile for videos opened from Zen ("Open in mpv"): gpu-next, good built-in scaling, upscaler picker (u / right-click, see scripts/upscale-menu.lua)
vo=gpu-next
hwdec=auto-safe
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=no
keep-open=yes
osd-font-size=26
# the bottombar OSC enforces a minimum layout width (~850 units), so in a small window its controls only get bigger when the window does (see zen-mpv-rules.lua)
script-opts=osc-vidscale=no
